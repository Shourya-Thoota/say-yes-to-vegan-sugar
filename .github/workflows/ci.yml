name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vegansugar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vegansugar_test
      RUN_PG_TESTS: "1"

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Migrate test database
        run: npm run db:migrate

      - name: Test (incl. real-Postgres integration)
        run: npm test

      - name: Production build
        env:
          NEXT_PUBLIC_SITE_URL: https://say-yes-to-vegan-sugar-production.up.railway.app
        run: npm run build

  workers-build:
    name: OpenNext Workers build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SITE_URL: https://say-yes-to-vegan-sugar-production.up.railway.app

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Builds with the same OpenNext and Wrangler configs Sites publishes
      # with, so this job also covers the R2 incremental cache and Durable
      # Object overrides, plus the failures that otherwise only surface during
      # a publish: Next falling out of the OpenNext support window (its build
      # refuses unsupported versions) and pg-cloudflare not being traced into
      # the Worker bundle.
      - name: OpenNext/Workers build
        run: >-
          npx opennextjs-cloudflare build
          --openNextConfigPath freebuff.open-next.config.ts
          --config freebuff.wrangler.jsonc

      # Runs the built Worker under wrangler dev with DATABASE_URL pointed at a
      # local TCP probe, then sends two sequential requests. Each must open
      # exactly one Postgres connection and close it (Terminate) via after(),
      # so a second getDb() call per request or a leaked connection fails CI.
      - name: Verify one Postgres connection per request
        run: npm run probe:workers-db
